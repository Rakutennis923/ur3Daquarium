<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D 療癒水族箱 - Urban Chillquarium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #07131f;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            touch-action: none;
        }
        .glass {
            background: rgba(12, 27, 44, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(125, 211, 252, 0.22);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }
        .glass-light {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .ui-transition {
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: translateY(10px);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.3);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.4);
            border-radius: 999px;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.95); }
            100% { opacity: 0; transform: translateY(-48px) scale(1.15); }
        }
        .coin-float {
            animation: floatUp 1.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            pointer-events: none;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.92) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-pop {
            animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="text-slate-100">

    <!-- 3D 畫布容器 -->
    <div id="canvas-container"></div>

    <!-- 浮動金幣提示容器 -->
    <div id="floating-texts" class="fixed inset-0 pointer-events-none z-20 overflow-hidden"></div>

    <!-- 頂部狀態列 -->
    <header id="top-hud" class="ui-transition fixed top-3 left-3 right-3 sm:top-4 sm:left-5 sm:right-5 z-30 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
        <div class="flex items-center gap-2 sm:gap-3 pointer-events-auto">
            <div class="glass px-3.5 py-2 rounded-2xl flex items-center gap-2">
                <span class="text-xl">🪙</span>
                <div>
                    <div class="text-[10px] text-cyan-200/70 leading-none">療癒金幣</div>
                    <div id="hud-coins" class="text-sm sm:text-base font-bold text-amber-300 tracking-wide">200</div>
                </div>
            </div>
            <div class="glass px-3.5 py-2 rounded-2xl flex items-center gap-2">
                <span class="text-xl">🐠</span>
                <div>
                    <div class="text-[10px] text-cyan-200/70 leading-none">魚缸容量</div>
                    <div id="hud-capacity" class="text-sm sm:text-base font-bold text-cyan-200">0 / 8</div>
                </div>
            </div>
            <div class="hidden md:flex glass px-3.5 py-2 rounded-2xl items-center gap-2">
                <span class="text-lg">✨</span>
                <div>
                    <div class="text-[10px] text-cyan-200/70 leading-none">被動收益</div>
                    <div id="hud-income" class="text-sm font-semibold text-emerald-300">+0 / 10秒</div>

            </div>
        </div>

        <div class="flex items-center gap-2 pointer-events-auto">
            <div class="glass p-1 rounded-2xl flex items-center gap-1">

                <button onclick="setLighting('sunset')" id="btn-light-sunset" class="px-2.5 py-1.5 rounded-xl text-xs font-medium transition text-slate-300 hover:text-white" title="都市黃昏">🌅</button>
                <button onclick="setLighting('night')" id="btn-light-night" class="px-2.5 py-1.5 rounded-xl text-xs font-medium transition text-slate-300 hover:text-white" title="深海夜光">🌙</button>
            </div>
            <button onclick="toggleMute()" id="mute-btn" class="glass w-9 h-9 sm:w-10 sm:h-10 rounded-2xl flex items-center justify-center text-sm sm:text-base hover:bg-white/10 transition" title="聲音開關">🔊</button>
            <button onclick="toggleZenMode()" class="glass px-2.5 sm:px-3 py-1.5 sm:py-2 h-9 sm:h-10 rounded-2xl flex items-center gap-1.5 text-xs sm:text-sm font-medium text-cyan-200 hover:bg-white/10 transition" title="隱藏介面純粹觀賞">
                <span>🌿</span>
                <span class="hidden sm:inline">純淨模式</span>
            </button>
        </div>
    </header>

    <!-- 右側常駐控制欄：時間流速拉桿 + 離線生態事件日誌 -->
    <aside id="right-dock" class="ui-transition fixed right-2.5 sm:right-4 top-28 sm:top-20 z-30 flex flex-col items-end gap-2 pointer-events-none">
        <div class="glass px-2.5 py-1.5 rounded-xl w-32 sm:w-40 pointer-events-auto">
            <div class="flex items-center justify-between text-[10px] mb-1">
                <span class="text-slate-300 flex items-center gap-0.5"><span>⏱️</span> 流速</span>
                <span id="speed-display" class="font-bold text-cyan-300 bg-cyan-500/20 px-1.5 py-0.2 rounded">1X</span>
            </div>
            <input id="time-speed-slider" type="range" min="0" max="3" step="1" value="1" oninput="setTimeScaleByIndex(this.value)" class="w-full accent-cyan-400 cursor-pointer h-1 bg-slate-700 rounded-lg">
            <div class="flex justify-between text-[9px] text-slate-400 mt-0.5 font-medium">
                <span class="cursor-pointer hover:text-white px-0.5" onclick="setTimeScale(0.5)">0.5X</span>
                <span class="cursor-pointer hover:text-white px-0.5" onclick="setTimeScale(1)">1X</span>
                <span class="cursor-pointer hover:text-white px-0.5" onclick="setTimeScale(3)">3X</span>
                <span class="cursor-pointer hover:text-white px-0.5" onclick="setTimeScale(6)">6X</span>
            </div>
        </div>

        <div id="offline-events-card" class="hidden glass w-64 sm:w-72 rounded-3xl p-4 pointer-events-auto animate-pop border border-cyan-400/35">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-1.5 font-bold text-sm text-cyan-200">

                    <span>離線期間生態日誌</span>
                </div>
                <button onclick="closeOfflineReport()" class="text-slate-400 hover:text-white w-6 h-6 rounded-full hover:bg-white/10 flex items-center justify-center text-xs">✕</button>
            </div>

                收下並繼續觀賞 ✨

        </div>
    </aside>

    <!-- 純淨觀賞模式還原按鈕 -->

                <span class="text-[9px] sm:text-[10px] font-medium text-cyan-100 leading-tight">魚類圖鑑</span>
            </button>
        </div>

    <!-- 多功能彈出視窗 -->
    <div id="modal-overlay" class="hidden fixed inset-0 z-40 bg-slate-950/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-3 sm:p-5">
        <div class="glass w-full max-w-2xl max-h-[82vh] rounded-3xl flex flex-col overflow-hidden animate-pop">
            <div class="px-5 py-4 border-b border-white/10 flex items-center justify-between">

                    <h2 id="modal-title" class="text-base sm:text-lg font-bold text-white">魚苗商店</h2>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-slate-200 transition">✕</button>
            </div>
            <div id="modal-body" class="p-4 sm:p-5 overflow-y-auto space-y-4"></div>
        </div>
    </div>

    <!-- 提示訊息 Toast -->
    <div id="toast-msg" class="fixed top-28 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-300">
        <div id="toast-text" class="glass px-4 py-2 rounded-2xl text-xs sm:text-sm font-medium text-amber-200 border border-amber-400/30 shadow-xl"></div>
    </div>

// 3. Web Audio API 療癒合成音效系統
class HealingAudio {
    constructor() {
        this.ctx = null;
    }
    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }
    playWaterDrop() {
        if (gameState.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        const baseFreq = 420 + Math.random() * 160;
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.85, now + 0.14);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.17);
    }
    playEatPop() {
        if (gameState.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(520, now + 0.08);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
    }
    playCoinChime() {
        if (gameState.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [987.77, 1318.51].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.07);
            gain.gain.setValueAtTime(0.07, now + idx * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.07);
            osc.stop(now + idx * 0.07 + 0.36);
        });
    }
}

    const y = camRadius * Math.cos(camPhi);
    const z = camRadius * Math.sin(camPhi) * Math.cos(camTheta);
    camera.position.set(x, y, z);
    camera.lookAt(0, -0.2, 0);
}

// 5. 高擬真 3D 魚類生成引擎
const fishTextureCache = new Map();

function getFishTextures(species, isShiny) {
    const key = `${species.id}_${isShiny ? 'shiny' : 'norm'}`;
    if (fishTextureCache.has(key)) return fishTextureCache.get(key);

    const primary = isShiny ? '#fbbf24' : species.baseColor;
    const secondary = isShiny ? '#ec4899' : species.secColor;
    const finCol = isShiny ? '#fef08a' : species.finColor;

    const w = 512, h = 256;
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d');

    const bumpCanvas = document.createElement('canvas');
    bumpCanvas.width = w;
    bumpCanvas.height = h;
    const bCtx = bumpCanvas.getContext('2d');
    bCtx.fillStyle = '#808080';
    bCtx.fillRect(0, 0, w, h);

    const bodyGrad = ctx.createLinearGradient(0, 0, 0, h);
    bodyGrad.addColorStop(0, shadeHex(primary, -38));
    bodyGrad.addColorStop(0.45, primary);
    bodyGrad.addColorStop(0.82, mixHex(primary, '#f8fafc', 0.45));
    bodyGrad.addColorStop(1, '#f1f5f9');
    ctx.fillStyle = bodyGrad;
    ctx.fillRect(0, 0, w, h);

    const scaleR = species.bodyType === 'arowana' ? 16 : (species.bodyType === 'mola' ? 8 : 11);
    for (let row = 0; row < h / scaleR + 2; row++) {
        for (let col = 0; col < w / (scaleR * 1.4) + 2; col++) {
            const cx = col * scaleR * 1.4 + (row % 2) * (scaleR * 0.7);
            const cy = row * scaleR * 0.85;

            ctx.beginPath();
            ctx.arc(cx, cy, scaleR, -Math.PI * 0.45, Math.PI * 0.45);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
            ctx.lineWidth = species.bodyType === 'arowana' ? 2.2 : 1.2;
            ctx.stroke();

            const bGrad = bCtx.createRadialGradient(cx - 2, cy, 1, cx, cy, scaleR);
            bGrad.addColorStop(0, '#d4d4d4');
            bGrad.addColorStop(0.85, '#9a9a9a');
            bGrad.addColorStop(1, '#4a4a4a');
            bCtx.beginPath();
            bCtx.arc(cx, cy, scaleR * 0.95, 0, Math.PI * 2);
            bCtx.fillStyle = bGrad;
            bCtx.fill();
        }
    }

    if (species.bodyType === 'neon_tetra' || species.id === 'neon_tetra') {
        ctx.fillStyle = secondary;
        ctx.fillRect(0, h * 0.52, w * 0.65, h * 0.28);
        const neonGrad = ctx.createLinearGradient(0, h * 0.36, 0, h * 0.5);
        neonGrad.addColorStop(0, '#38bdf8');
        neonGrad.addColorStop(0.5, '#a5f3fc');
        neonGrad.addColorStop(1, '#0284c7');
        ctx.fillStyle = neonGrad;
        ctx.fillRect(w * 0.12, h * 0.36, w * 0.82, h * 0.13);
    } else if (species.bodyType === 'clown') {
        [0.24, 0.52, 0.82].forEach((posRatio, idx) => {
            const bandW = idx === 1 ? 38 : 26;
            const bx = w * posRatio - bandW / 2;
            ctx.fillStyle = '#090d16';
            ctx.fillRect(bx - 5, 0, bandW + 10, h);
            ctx.fillStyle = secondary;
            ctx.fillRect(bx, 0, bandW, h);
        });
    } else if (species.bodyType === 'tang') {
        ctx.fillStyle = secondary;
        ctx.beginPath();
        ctx.ellipse(w * 0.55, h * 0.42, w * 0.28, h * 0.24, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = primary;
        ctx.beginPath();
        ctx.ellipse(w * 0.56, h * 0.44, w * 0.14, h * 0.11, 0, 0, Math.PI * 2);
        ctx.fill();
    } else if (species.bodyType === 'angel') {
        [0.22, 0.44, 0.66, 0.85].forEach((posRatio, idx) => {
            ctx.fillStyle = 'rgba(15, 23, 42, 0.78)';
            ctx.fillRect(w * posRatio, 0, idx % 2 === 0 ? 22 : 14, h);
        });
    } else if (species.bodyType === 'lion') {
        for (let x = 20; x < w; x += 28) {
            ctx.fillStyle = secondary;
            ctx.fillRect(x, 0, 11, h);
        }
    } else if (species.bodyType === 'arowana') {
        for (let row = 1; row < h / scaleR; row++) {
            for (let col = 1; col < w / (scaleR * 1.4); col++) {
                const cx = col * scaleR * 1.4 + (row % 2) * (scaleR * 0.7);
                const cy = row * scaleR * 0.85;
                ctx.beginPath();
                ctx.arc(cx, cy, scaleR * 0.75, -Math.PI * 0.4, Math.PI * 0.4);
                ctx.strokeStyle = secondary;
                ctx.lineWidth = 3.2;
                ctx.stroke();
            }
        }
    } else if (species.bodyType === 'mola') {
        for (let i = 0; i < 65; i++) {
            ctx.fillStyle = i % 2 === 0 ? 'rgba(241,245,249,0.22)' : 'rgba(30,41,59,0.28)';
            ctx.beginPath();
            ctx.arc(Math.random() * w, Math.random() * h, 4 + Math.random() * 14, 0, Math.PI * 2);
            ctx.fill();
        }
    } else if (species.bodyType === 'guppy') {
        const tailGrad = ctx.createLinearGradient(0, 0, w * 0.55, 0);
        tailGrad.addColorStop(0, secondary);
        tailGrad.addColorStop(1, primary);
        ctx.fillStyle = tailGrad;
        ctx.fillRect(0, 0, w * 0.48, h);
        for (let s = 0; s < 24; s++) {
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(Math.random() * w * 0.45, Math.random() * h, 3 + Math.random() * 4, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    const fCanvas = document.createElement('canvas');
    fCanvas.width = 256;
    fCanvas.height = 256;
    const fCtx = fCanvas.getContext('2d');
    const fGrad = fCtx.createLinearGradient(0, 0, 256, 0);
    fGrad.addColorStop(0, primary);
    fGrad.addColorStop(0.55, finCol);
    fGrad.addColorStop(1, 'rgba(255,255,255,0.25)');
    fCtx.fillStyle = fGrad;
    fCtx.fillRect(0, 0, 256, 256);

    for (let r = 8; r < 256; r += 11) {
        fCtx.beginPath();
        fCtx.moveTo(0, r);
        fCtx.quadraticCurveTo(128, r + (r - 128) * 0.18, 256, r + (r - 128) * 0.35);
        fCtx.strokeStyle = 'rgba(255, 255, 255, 0.32)';
        fCtx.lineWidth = 1.6;
        fCtx.stroke();
    }
    if (species.bodyType === 'guppy' || species.bodyType === 'betta') {
        for (let d = 0; d < 26; d++) {
            fCtx.fillStyle = species.bodyType === 'guppy' ? 'rgba(15,23,42,0.75)' : 'rgba(255,255,255,0.35)';
            fCtx.beginPath();
            fCtx.arc(70 + Math.random() * 170, 20 + Math.random() * 216, 3 + Math.random() * 5, 0, Math.PI * 2);
            fCtx.fill();
        }
    }

    const bodyTex = new THREE.CanvasTexture(canvas);
    const bumpTex = new THREE.CanvasTexture(bumpCanvas);
    const finTex = new THREE.CanvasTexture(fCanvas);
    const result = { bodyTex, bumpTex, finTex, primary, secondary, finCol };
    fishTextureCache.set(key, result);
    return result;
}

function shadeHex(hex, amt) {
    const num = parseInt(hex.replace('#', ''), 16);
    const r = Math.min(255, Math.max(0, (num >> 16) + amt));
    const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amt));
    const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amt));
    return `rgb(${r},${g},${b})`;
}

function mixHex(hex1, hex2, ratio) {
    const n1 = parseInt(hex1.replace('#', ''), 16);
    const n2 = parseInt(hex2.replace('#', ''), 16);
    const r = Math.round(((n1 >> 16) * (1 - ratio)) + ((n2 >> 16) * ratio));
    const g = Math.round((((n1 >> 8) & 0xff) * (1 - ratio)) + (((n2 >> 8) & 0xff) * ratio));
    const b = Math.round(((n1 & 0xff) * (1 - ratio)) + ((n2 & 0xff) * ratio));
    return `rgb(${r},${g},${b})`;
}

function buildSculptedBodyGeometry(bodyType) {
    let sx = 0.22, sy = 0.28, sz = 0.62;
    if (bodyType === 'goldfish') { sx = 0.34; sy = 0.38; sz = 0.56; }
    else if (bodyType === 'angel') { sx = 0.11; sy = 0.54; sz = 0.50; }
    else if (bodyType === 'tang') { sx = 0.14; sy = 0.44; sz = 0.62; }
    else if (bodyType === 'arowana') { sx = 0.19; sy = 0.26; sz = 1.05; }
    else if (bodyType === 'mola') { sx = 0.18; sy = 0.72; sz = 0.68; }
    else if (bodyType === 'guppy' || bodyType === 'tetra') { sx = 0.16; sy = 0.20; sz = 0.52; }
    else if (bodyType === 'betta') { sx = 0.17; sy = 0.24; sz = 0.56; }
    else if (bodyType === 'lion') { sx = 0.25; sy = 0.34; sz = 0.62; }

    const geo = new THREE.SphereGeometry(1, 28, 20);
    const pos = geo.attributes.position;
    const baseX = new Float32Array(pos.count);
    const baseZ = new Float32Array(pos.count);

    for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);

        if (z > 0) {
            const headTaper = 1.0 - Math.pow(z, 2.2) * 0.42;
            x *= headTaper;
            y *= (1.0 - Math.pow(z, 2.4) * 0.35);
            if (bodyType === 'arowana' && y < 0) y *= 0.85;
        } else {
            const tailDist = Math.abs(z);
            const peduncle = bodyType === 'mola'
                ? (1.0 - Math.pow(tailDist, 1.5) * 0.25)
                : (1.0 - Math.pow(tailDist, 1.45) * 0.76);
            x *= Math.max(0.14, peduncle);
            y *= Math.max(0.20, peduncle);
        }

        if (y > 0 && bodyType !== 'arowana') {
            y += Math.sin((1 - Math.abs(z)) * Math.PI * 0.5) * 0.12;
        }

        const fx = x * sx;
        const fy = y * sy;
        const fz = z * sz;
        pos.setXYZ(i, fx, fy, fz);
        baseX[i] = fx;
        baseZ[i] = fz;
    }
    geo.computeVertexNormals();
    geo.userData = { sx, sy, sz, baseX, baseZ, halfLen: sz };
    return geo;
}

function buildTailFinGeometry(bodyType) {
    const shape = new THREE.Shape();
    if (bodyType === 'guppy' || bodyType === 'betta') {
        const len = bodyType === 'betta' ? 0.68 : 0.62;
        const h = bodyType === 'betta' ? 0.52 : 0.44;
        shape.moveTo(0, 0.05);
        shape.bezierCurveTo(-len * 0.45, h * 0.9, -len * 0.95, h, -len, h * 0.35);
        shape.bezierCurveTo(-len * 1.08, 0, -len, -h * 0.35, -len, -h * 0.35);
        shape.bezierCurveTo(-len * 0.95, -h, -len * 0.45, -h * 0.9, 0, -0.05);
    } else if (bodyType === 'goldfish') {
        shape.moveTo(0, 0.05);
        shape.quadraticCurveTo(-0.35, 0.42, -0.68, 0.34);
        shape.quadraticCurveTo(-0.48, 0.05, -0.45, 0);
        shape.quadraticCurveTo(-0.48, -0.05, -0.68, -0.34);
        shape.quadraticCurveTo(-0.35, -0.42, 0, -0.05);
    } else if (bodyType === 'mola') {
        shape.moveTo(0, 0.45);
        shape.bezierCurveTo(-0.18, 0.3, -0.22, 0.1, -0.16, 0);
        shape.bezierCurveTo(-0.22, -0.1, -0.18, -0.3, 0, -0.45);
    } else if (bodyType === 'angel' || bodyType === 'tetra' || bodyType === 'tang') {
        shape.moveTo(0, 0.06);
        shape.lineTo(-0.38, 0.30);
        shape.quadraticCurveTo(-0.26, 0, -0.38, -0.30);
        shape.lineTo(0, -0.06);
    } else {
        shape.moveTo(0, 0.07);
        shape.quadraticCurveTo(-0.25, 0.28, -0.44, 0.22);
        shape.quadraticCurveTo(-0.48, 0, -0.44, -0.22);
        shape.quadraticCurveTo(-0.25, -0.28, 0, -0.07);
    }
    shape.closePath();

    const geo = new THREE.ShapeGeometry(shape, 16);
    geo.rotateY(Math.PI / 2);
    return geo;
}

function buildDorsalAndAnalFins(bodyType, sz, sy, finMat) {
    const group = new THREE.Group();

    const dShape = new THREE.Shape();
    if (bodyType === 'angel') {
        dShape.moveTo(sz * 0.25, 0);
        dShape.quadraticCurveTo(-sz * 0.1, sy * 0.8, -sz * 0.45, sy * 1.45);
        dShape.quadraticCurveTo(-sz * 0.35, sy * 0.4, -sz * 0.55, 0);
    } else if (bodyType === 'mola') {
        dShape.moveTo(-sz * 0.15, 0);
        dShape.lineTo(-sz * 0.38, sy * 0.95);
        dShape.lineTo(-sz * 0.58, 0);
    } else if (bodyType === 'lion') {
        dShape.moveTo(sz * 0.35, 0);
        for (let s = 0; s < 6; s++) {
            const xPeak = sz * (0.28 - s * 0.14);
            const xVal = xPeak - sz * 0.07;
            dShape.lineTo(xPeak, sy * (0.75 - s * 0.04));
            dShape.lineTo(xVal, sy * 0.18);
        }
        dShape.lineTo(-sz * 0.55, 0);
    } else if (bodyType === 'betta') {
        dShape.moveTo(sz * 0.15, 0);
        dShape.bezierCurveTo(-sz * 0.05, sy * 1.15, -sz * 0.55, sy * 1.15, -sz * 0.72, 0);
    } else {
        dShape.moveTo(sz * 0.22, 0);
        dShape.quadraticCurveTo(-sz * 0.08, sy * 0.72, -sz * 0.48, sy * 0.48);
        dShape.lineTo(-sz * 0.52, 0);
    }
    dShape.closePath();
    const dGeo = new THREE.ShapeGeometry(dShape, 12);
    dGeo.rotateY(Math.PI / 2);
    const dorsal = new THREE.Mesh(dGeo, finMat);
    dorsal.position.y = sy * 0.76;
    group.add(dorsal);

    const aShape = new THREE.Shape();
    if (bodyType === 'angel') {
        aShape.moveTo(sz * 0.15, 0);
        aShape.quadraticCurveTo(-sz * 0.15, -sy * 0.85, -sz * 0.48, -sy * 1.5);
        aShape.quadraticCurveTo(-sz * 0.38, -sy * 0.4, -sz * 0.60, 0);
    } else if (bodyType === 'mola') {
        aShape.moveTo(-sz * 0.15, 0);
        aShape.lineTo(-sz * 0.38, -sy * 0.95);
        aShape.lineTo(-sz * 0.58, 0);
    } else if (bodyType === 'betta') {
        aShape.moveTo(sz * 0.25, 0);
        aShape.bezierCurveTo(-sz * 0.1, -sy * 1.05, -sz * 0.65, -sy * 1.05, -sz * 0.75, 0);
    } else {
        aShape.moveTo(-sz * 0.05, 0);
        aShape.quadraticCurveTo(-sz * 0.32, -sy * 0.52, -sz * 0.58, -sy * 0.32);
        aShape.lineTo(-sz * 0.62, 0);
    }
    aShape.closePath();
    const aGeo = new THREE.ShapeGeometry(aShape, 12);
    aGeo.rotateY(Math.PI / 2);
    const anal = new THREE.Mesh(aGeo, finMat);
    anal.position.y = -sy * 0.72;
    group.add(anal);

    return group;
}

function createFish3DMesh(fishData) {
    const species = FISH_SPECIES.find(s => s.id === fishData.speciesId) || FISH_SPECIES[0];
    const root = new THREE.Group();
    const texPack = getFishTextures(species, fishData.isShiny);

    const bodyGeo = buildSculptedBodyGeometry(species.bodyType);
    const { sx, sy, sz } = bodyGeo.userData;

    const bodyMat = new THREE.MeshPhysicalMaterial({
        map: texPack.bodyTex,
        bumpMap: texPack.bumpTex,
        bumpScale: species.bodyType === 'arowana' ? 0.032 : 0.016,
        roughness: species.bodyType === 'mola' ? 0.55 : 0.24,
        metalness: fishData.isShiny ? 0.48 : (species.bodyType === 'arowana' ? 0.38 : 0.12),
        clearcoat: 0.85,
        clearcoatRoughness: 0.12
    });
    const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    bodyMesh.castShadow = true;
    bodyMesh.userData = { fishId: fishData.id };
    root.add(bodyMesh);

    const finMat = new THREE.MeshPhysicalMaterial({
        map: texPack.finTex,
        color: 0xffffff,
        roughness: 0.32,
        metalness: fishData.isShiny ? 0.3 : 0.05,
        transparent: true,
        opacity: species.bodyType === 'mola' ? 0.94 : 0.82,
        side: THREE.DoubleSide,
        depthWrite: false
    });

    const tailPivot = new THREE.Group();
    tailPivot.position.set(0, 0, -sz * 0.86);
    const tailGeo = buildTailFinGeometry(species.bodyType);
    const tailMesh = new THREE.Mesh(tailGeo, finMat);
    tailPivot.add(tailMesh);
    if (species.bodyType === 'goldfish') {
        const tailL = tailMesh.clone();
        tailL.rotation.y = 0.24;
        tailL.rotation.z = 0.18;
        const tailR = tailMesh.clone();
        tailR.rotation.y = -0.24;
        tailR.rotation.z = -0.18;
        tailPivot.remove(tailMesh);
        tailPivot.add(tailL, tailR);
    }
    root.add(tailPivot);

    const verticalFins = buildDorsalAndAnalFins(species.bodyType, sz, sy, finMat);
    root.add(verticalFins);

    const pecShape = new THREE.Shape();
    const pecLen = species.bodyType === 'lion' ? 0.58 : (species.bodyType === 'arowana' ? 0.44 : 0.28);
    pecShape.moveTo(0, 0);
    pecShape.quadraticCurveTo(-pecLen * 0.6, 0.12, -pecLen, 0.04);
    pecShape.quadraticCurveTo(-pecLen * 0.8, -0.12, 0, -0.05);
    pecShape.closePath();
    const pecGeo = new THREE.ShapeGeometry(pecShape, 8);
    pecGeo.rotateY(Math.PI / 2);

    const pecLeft = new THREE.Mesh(pecGeo, finMat);
    pecLeft.position.set(sx * 0.82, -sy * 0.18, sz * 0.24);
    pecLeft.rotation.set(0.15, 0.35, -0.35);

    const pecRight = new THREE.Mesh(pecGeo, finMat);
    pecRight.position.set(-sx * 0.82, -sy * 0.18, sz * 0.24);
    pecRight.rotation.set(0.15, -0.35, 0.35);
    root.add(pecLeft, pecRight);

    const gillGeo = new THREE.RingGeometry(sy * 0.22, sy * 0.32, 12, 1, -Math.PI * 0.42, Math.PI * 0.84);
    gillGeo.rotateY(Math.PI / 2);
    const gillMat = new THREE.MeshStandardMaterial({
        color: shadeHex(texPack.primary, -55),
        side: THREE.DoubleSide,
        roughness: 0.4
    });
    const gillLeft = new THREE.Mesh(gillGeo, gillMat);
    gillLeft.position.set(sx * 0.86, -sy * 0.04, sz * 0.36);
    const gillRight = new THREE.Mesh(gillGeo, gillMat);
    gillRight.position.set(-sx * 0.86, -sy * 0.04, sz * 0.36);
    root.add(gillLeft, gillRight);

    const eyeSize = species.bodyType === 'goldfish' ? 0.088 : 0.068;
    const irisGeo = new THREE.SphereGeometry(eyeSize, 14, 14);
    const irisMat = new THREE.MeshStandardMaterial({
        color: fishData.isShiny ? 0xfde047 : 0xd97706,
        metalness: 0.6,
        roughness: 0.2
    });
    const pupilGeo = new THREE.SphereGeometry(eyeSize * 0.66, 12, 12);
    const pupilMat = new THREE.MeshPhysicalMaterial({ color: 0x05080f, roughness: 0.05, clearcoat: 1.0 });
    const glintGeo = new THREE.SphereGeometry(eyeSize * 0.22, 6, 6);
    const glintMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    [-1, 1].forEach(side => {
        const eyeGroup = new THREE.Group();
        const iris = new THREE.Mesh(irisGeo, irisMat);
        const pupil = new THREE.Mesh(pupilGeo, pupilMat);
        pupil.position.x = side * eyeSize * 0.46;
        const glint = new THREE.Mesh(glintGeo, glintMat);
        glint.position.set(side * eyeSize * 0.85, eyeSize * 0.28, eyeSize * 0.24);
        eyeGroup.add(iris, pupil, glint);
        eyeGroup.position.set(side * sx * 0.64, sy * 0.18, sz * 0.58);
        root.add(eyeGroup);
    });

    if (species.bodyType === 'arowana') {
        const barbelGeo = new THREE.ConeGeometry(0.014, 0.22, 6);
        barbelGeo.rotateX(Math.PI * 0.38);
        const barbelMat = new THREE.MeshStandardMaterial({ color: texPack.secondary, metalness: 0.5, roughness: 0.3 });
        [-1, 1].forEach(side => {
            const barbel = new THREE.Mesh(barbelGeo, barbelMat);
            barbel.position.set(side * 0.045, -sy * 0.14, sz * 0.98);
            barbel.rotation.y = side * 0.28;
            root.add(barbel);
        });
    }

    if (fishData.isShiny) {
        const auraLight = new THREE.PointLight(0xfde047, 0.7, 2.8);
        root.add(auraLight);
    }

    root.position.set(
        (Math.random() - 0.5) * (TANK_W - 2.6),
        (Math.random() - 0.5) * (TANK_H - 2.4),
        (Math.random() - 0.5) * (TANK_D - 2.2)
    );

    const stageInfo = getFishStageInfo(fishData);
    root.scale.setScalar(stageInfo.scale);

    fishGroup.add(root);
    fishMeshes.set(fishData.id, {
        root,
        bodyGeo,
        tailPivot,
        pecLeft,
        pecRight,
        gillLeft,
        gillRight,
        species,
        velocity: new THREE.Vector3((Math.random() - 0.5) * 0.8, 0, (Math.random() - 0.5) * 0.8),
        targetPos: new THREE.Vector3(
            (Math.random() - 0.5) * (TANK_W - 2.6),
            (Math.random() - 0.5) * (TANK_H - 2.4),
            (Math.random() - 0.5) * (TANK_D - 2.2)
        ),
        decisionTimer: Math.random() * 2,
        swimPhase: Math.random() * Math.PI * 2,
        currentRoll: 0
    });
}

function removeFish3DMesh(fishId) {
    const entry = fishMeshes.get(fishId);
    if (entry) {
        fishGroup.remove(entry.root);
        fishMeshes.delete(fishId);
    }
}

function rebuildDecorations3D() {
    while (decorGroup.children.length > 0) {
        decorGroup.remove(decorGroup.children[0]);
    }
    const floorY = -TANK_H / 2 + 0.45;

    if (gameState.decorations.includes('driftwood')) {
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.9 });
        const mossMat = new THREE.MeshStandardMaterial({ color: 0x4d7c0f, roughness: 0.85 });
        const log1 = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 2.4, 8), woodMat);
        log1.position.set(-2.3, floorY + 0.5, -0.6);
        log1.rotation.z = -0.85;
        log1.rotation.y = 0.3;
        const moss = new THREE.Mesh(new THREE.SphereGeometry(0.32, 8, 8), mossMat);
        moss.scale.set(1.8, 0.5, 1.2);
        moss.position.set(-2.1, floorY + 0.72, -0.55);
        decorGroup.add(log1, moss);
    }

    if (gameState.decorations.includes('coral_reef')) {
        const coralColors = [0xf43f5e, 0xfb923c, 0xc084fc];
        coralColors.forEach((col, i) => {
            const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.65 });
            for (let b = 0; b < 4; b++) {
                const branch = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.12, 0.7 + Math.random() * 0.5, 7), mat);
                branch.position.set(1.8 + i * 0.55 + (Math.random() - 0.5) * 0.3, floorY + 0.3, 0.8 + (Math.random() - 0.5) * 0.5);
                branch.rotation.set((Math.random() - 0.5) * 0.5, 0, (Math.random() - 0.5) * 0.5);
                decorGroup.add(branch);
            }
        });
    }

    if (gameState.decorations.includes('castle')) {
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.8 });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, roughness: 0.5 });
        const base = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.1, 1.1), stoneMat);
        base.position.set(0, floorY + 0.5, -1.3);
        const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.36, 1.6, 10), stoneMat);
        tower.position.set(-0.4, floorY + 0.8, -1.3);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.65, 10), roofMat);
        roof.position.set(-0.4, floorY + 1.9, -1.3);
        decorGroup.add(base, tower, roof);
    }

    if (gameState.decorations.includes('crystal')) {
        const crysMat = new THREE.MeshPhysicalMaterial({
            color: 0x22d3ee,
            emissive: 0x0891b2,
            emissiveIntensity: 0.65,
            roughness: 0.15,
            transparent: true,
            opacity: 0.88
        });
        for (let c = 0; c < 5; c++) {
            const h = 0.6 + Math.random() * 0.9;
            const shard = new THREE.Mesh(new THREE.ConeGeometry(0.14, h, 5), crysMat);
            shard.position.set(2.4 + (Math.random() - 0.5) * 0.7, floorY + h / 2 - 0.1, -1.4 + (Math.random() - 0.5) * 0.6);
            shard.rotation.set((Math.random() - 0.5) * 0.45, Math.random() * 3, (Math.random() - 0.5) * 0.45);
            decorGroup.add(shard);
        }
        const crysLight = new THREE.PointLight(0x22d3ee, 1.1, 5);
        crysLight.position.set(2.4, floorY + 0.8, -1.4);
        decorGroup.add(crysLight);
    }
}

// 6. 遊戲邏輯與動畫迴圈
const clock = new THREE.Clock();
let passiveIncomeTimer = 0;
let autoSaveTimer = 0;

function getMaxCapacity() {
    return 8 + (gameState.tankLevel - 1) * 4;
}

function getFishStageInfo(fish) {
    const species = FISH_SPECIES.find(s => s.id === fish.speciesId) || FISH_SPECIES[0];
    const ratio = Math.min(1, fish.growth / species.growthTime);
    if (ratio < 0.35) {
        return { stage: 'fry', label: '魚苗', scale: 0.48 + (ratio / 0.35) * 0.24, progress: Math.floor(ratio * 100), isAdult: false };
    } else if (ratio < 1.0) {
        return { stage: 'juvenile', label: '幼魚', scale: 0.72 + ((ratio - 0.35) / 0.65) * 0.28, progress: Math.floor(ratio * 100), isAdult: false };
    } else {
        return { stage: 'adult', label: '成魚 ✨', scale: 1.08, progress: 100, isAdult: true };
    }
}

function getFishSellValue(fish) {
    const species = FISH_SPECIES.find(s => s.id === fish.speciesId) || FISH_SPECIES[0];
    const stageInfo = getFishStageInfo(fish);
    let mult = stageInfo.stage === 'fry' ? 0.5 : (stageInfo.stage === 'juvenile' ? 1.0 : 1.85);
    if (fish.isShiny) mult *= 2.5;
    return Math.round(species.basePrice * mult);
}

function getFishPassiveIncome(fish) {
    const species = FISH_SPECIES.find(s => s.id === fish.speciesId) || FISH_SPECIES[0];
    const stageInfo = getFishStageInfo(fish);
    if (!stageInfo.isAdult) return 0;
    let rate = species.passiveRate;
    if (fish.isShiny) rate *= 2;
    if (gameState.decorations.includes('castle')) rate = Math.ceil(rate * 1.2);
    return rate;
}

function animate() {
    requestAnimationFrame(animate);
    const rawDt = Math.min(clock.getDelta(), 0.05);
    const dt = rawDt * timeScale;
    const elapsed = clock.getElapsedTime();

    if (waterSurfaceMesh) {
        const pos = waterSurfaceMesh.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i);
            const z = pos.getZ(i);
            pos.setY(i, Math.sin(x * 1.4 + elapsed * 1.8) * 0.04 + Math.cos(z * 1.4 + elapsed * 1.5) * 0.04);
        }
        pos.needsUpdate = true;
    }

    if (sandCausticsMesh && sandCausticsMesh.material.map) {
        sandCausticsMesh.material.map.offset.x = Math.sin(elapsed * 0.35) * 0.25;
        sandCausticsMesh.material.map.offset.y = elapsed * 0.06;
    }
    godRays.forEach(r => {
        r.mesh.rotation.z = -0.12 + Math.sin(elapsed * 0.7 + r.phase) * 0.045;
        r.mesh.material.opacity = 0.045 + Math.sin(elapsed * 1.2 + r.phase) * 0.015;
    });

    seaweeds.forEach(sw => {
        sw.group.rotation.z = Math.sin(elapsed * sw.speed + sw.phase) * 0.14;
        sw.group.rotation.x = Math.cos(elapsed * sw.speed * 0.8 + sw.phase) * 0.08;
    });

    bubbles.forEach(b => {
        b.mesh.position.y += b.speed * dt;
        b.mesh.position.x += Math.sin(elapsed * 3 + b.wobbleOffset) * 0.25 * dt;
        if (b.mesh.position.y > TANK_H / 2 - 0.4) {
            resetBubble(b.mesh, false);
        }
    });

    for (let i = foodPellets.length - 1; i >= 0; i--) {
        const p = foodPellets[i];
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.x += Math.sin(elapsed * 4 + p.wobble) * 0.15 * dt;
        if (p.mesh.position.y <= -TANK_H / 2 + 0.38) {
            p.mesh.position.y = -TANK_H / 2 + 0.38;
            p.vy = 0;
            p.life = (p.life || 4.0) - dt;
            if (p.life <= 0) {
                foodGroup.remove(p.mesh);
                foodPellets.splice(i, 1);
            }
        }
    }

    const decorGrowthMult = gameState.decorations.includes('coral_reef') ? 1.15 : 1.0;

    gameState.fishes.forEach(fish => {
        const entry = fishMeshes.get(fish.id);
        if (!entry) return;

        fish.hunger = Math.max(0, fish.hunger - dt * 0.65);
        const hungerSpeedMult = fish.hunger > 20 ? 1.0 : 0.35;
        fish.growth += dt * hungerSpeedMult * decorGrowthMult;

        const stageInfo = getFishStageInfo(fish);
        entry.root.scale.lerp(new THREE.Vector3(stageInfo.scale, stageInfo.scale, stageInfo.scale), 0.08);

        let nearestFood = null;
        let minDist = 999;
        if (fish.hunger < 96 && foodPellets.length > 0) {
            foodPellets.forEach(p => {
                const d = entry.root.position.distanceTo(p.mesh.position);
                if (d < minDist) {
                    minDist = d;
                    nearestFood = p;
                }
            });
        }

        let baseSpeed = entry.species.bodyType === 'mola' ? 0.75 : (entry.species.bodyType === 'lion' ? 0.9 : 1.32);
        if (nearestFood) {
            entry.targetPos.copy(nearestFood.mesh.position);
            baseSpeed *= 1.75;

            if (minDist < 0.58) {
                fish.hunger = Math.min(100, fish.hunger + nearestFood.nutrition);
                fish.growth += 4.5 * nearestFood.growthBonus;
                const idx = foodPellets.indexOf(nearestFood);
                if (idx > -1) {
                    foodGroup.remove(nearestFood.mesh);
                    foodPellets.splice(idx, 1);
                }
                sound.playEatPop();
            }
        } else {
            entry.decisionTimer -= dt;
            if (entry.decisionTimer <= 0 || entry.root.position.distanceTo(entry.targetPos) < 0.75) {
                entry.targetPos.set(
                    (Math.random() - 0.5) * (TANK_W - 2.3),
                    (Math.random() - 0.5) * (TANK_H - 2.3),
                    (Math.random() - 0.5) * (TANK_D - 1.9)
                );
                entry.decisionTimer = 2.4 + Math.random() * 3.6;
            }
        }

        const dir = new THREE.Vector3().subVectors(entry.targetPos, entry.root.position);
        const dist = dir.length();
        const currentSpeed = entry.velocity.length();

        if (dist > 0.05 && dt > 0) {
            dir.normalize();
            const desiredSpeed = dist < 1.1 && !nearestFood ? baseSpeed * 0.45 : baseSpeed;
            entry.velocity.lerp(dir.multiplyScalar(desiredSpeed), Math.min(1, 0.045 * Math.max(1, timeScale * 0.4)));
            entry.root.position.addScaledVector(entry.velocity, dt);

            const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(entry.root.quaternion);
            const crossY = forward.x * dir.z - forward.z * dir.x;
            const targetRoll = THREE.MathUtils.clamp(crossY * 0.55, -0.35, 0.35);
            entry.currentRoll = THREE.MathUtils.lerp(entry.currentRoll, targetRoll, 0.08);

            const lookTarget = entry.root.position.clone().add(entry.velocity);
            const dummy = new THREE.Object3D();
            dummy.position.copy(entry.root.position);
            dummy.lookAt(lookTarget);
            dummy.rotateZ(entry.currentRoll);
            entry.root.quaternion.slerp(dummy.quaternion, 0.08);
        }

        // S 型魚身脊椎擺動與魚鰭律動
        const speedFactor = Math.max(0.45, currentSpeed);
        entry.swimPhase += dt * (4.2 + speedFactor * 4.5);
        const posAttr = entry.bodyGeo.attributes.position;
        const { baseX, baseZ, halfLen } = entry.bodyGeo.userData;
        for (let i = 0; i < posAttr.count; i++) {
            const zNorm = (halfLen - baseZ[i]) / (halfLen * 2);
            const amp = Math.pow(Math.max(0, zNorm), 1.75) * 0.085;
            const wave = Math.sin(entry.swimPhase - zNorm * 3.4);
            posAttr.setX(i, baseX[i] + wave * amp);
        }
        posAttr.needsUpdate = true;

        entry.tailPivot.rotation.y = Math.sin(entry.swimPhase - 2.4) * 0.45;
        entry.pecLeft.rotation.y = 0.35 + Math.sin(entry.swimPhase * 0.7) * 0.25;
        entry.pecRight.rotation.y = -0.35 - Math.sin(entry.swimPhase * 0.7) * 0.25;
        const gillBreath = 0.06 + Math.sin(elapsed * 3.5 + entry.swimPhase * 0.2) * 0.04;
        entry.gillLeft.rotation.y = gillBreath;
        entry.gillRight.rotation.y = -gillBreath;

        // 限制魚兒活動範圍不穿出玻璃缸
        const boundX = TANK_W / 2 - 0.85;
        const boundY = TANK_H / 2 - 0.85;
        const boundZ = TANK_D / 2 - 0.75;
        entry.root.position.x = THREE.MathUtils.clamp(entry.root.position.x, -boundX, boundX);
        entry.root.position.y = THREE.MathUtils.clamp(entry.root.position.y, -boundY, boundY);
        entry.root.position.z = THREE.MathUtils.clamp(entry.root.position.z, -boundZ, boundZ);
    });

    passiveIncomeTimer += dt;
    if (passiveIncomeTimer >= 10) {
        passiveIncomeTimer = 0;
        grantPassiveIncome();
    }

    autoSaveTimer += rawDt;
    if (autoSaveTimer >= 15) {
        autoSaveTimer = 0;
        saveGame();
    }

    if (selectedFishId) {
        updateInspectorLive();
    }

    renderer.render(scene, camera);
}

// 7. 攝影機控制與畫布點擊互動（支援手機單指順暢旋轉與雙指縮放）
function setupControls(domElement) {
    let pinchStartDist = 0;
    let pinchStartRadius = camRadius;
    let isTouchActive = false;

    // 手機與平板專屬觸控支援（避免瀏覽器預設滑動干擾）
    domElement.addEventListener('touchstart', (e) => {
        isTouchActive = true;
        if (e.touches.length === 1) {
            isDragging = true;
            dragMoved = false;
            prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2) {
            isDragging = false;
            dragMoved = true;
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            pinchStartDist = Math.hypot(dx, dy);
            pinchStartRadius = camRadius;
        }
    }, { passive: false });

    domElement.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1 && isDragging) {
            const dx = e.touches[0].clientX - prevPointer.x;
            const dy = e.touches[0].clientY - prevPointer.y;
            if (Math.abs(dx) > 5 || Math.abs(dy) > 5) dragMoved = true;
            camTheta -= dx * 0.0095;
            camPhi = Math.max(0.45, Math.min(Math.PI * 0.58, camPhi - dy * 0.0095));
            updateCameraPosition();
            prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.touches.length === 2 && pinchStartDist > 0) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.hypot(dx, dy);
            const scale = pinchStartDist / Math.max(10, dist);
            camRadius = Math.max(8.5, Math.min(23, pinchStartRadius * scale));
            updateCameraPosition();
        }
    }, { passive: false });

    domElement.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) {
            if (isDragging && !dragMoved && e.changedTouches.length > 0) {
                handleCanvasTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
            }
            isDragging = false;
            pinchStartDist = 0;
            setTimeout(() => { isTouchActive = false; }, 100);
        }
    });

    // 電腦滑鼠支援
    domElement.addEventListener('mousedown', (e) => {
        if (isTouchActive) return;
        isDragging = true;
        dragMoved = false;
        prevPointer = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
        if (isTouchActive || !isDragging) return;
        const dx = e.clientX - prevPointer.x;
        const dy = e.clientY - prevPointer.y;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
        camTheta -= dx * 0.0065;
        camPhi = Math.max(0.45, Math.min(Math.PI * 0.58, camPhi - dy * 0.0065));
        updateCameraPosition();
        prevPointer = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', (e) => {
        if (isTouchActive) return;
        if (isDragging && !dragMoved && e.target === domElement) {
            handleCanvasTap(e.clientX, e.clientY);
        }
        isDragging = false;
    });

    domElement.addEventListener('wheel', (e) => {
        e.preventDefault();
        camRadius = Math.max(8.5, Math.min(23, camRadius + e.deltaY * 0.01));
        updateCameraPosition();
    }, { passive: false });
}

function handleCanvasTap(clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(pointerNDC, camera);

    const fishHits = raycaster.intersectObjects(fishGroup.children, true);
    if (fishHits.length > 0) {
        let obj = fishHits[0].object;
        while (obj && !obj.userData?.fishId) {
            obj = obj.parent;
        }
        if (obj && obj.userData?.fishId) {
            openFishInspector(obj.userData.fishId);
            return;
        }
    }

    if (selectedFishId) {
        closeInspector();
    }

    const hitPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
    const targetPoint = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(hitPlane, targetPoint)) {
        const fx = THREE.MathUtils.clamp(targetPoint.x, -TANK_W / 2 + 0.8, TANK_W / 2 - 0.8);
        const fy = THREE.MathUtils.clamp(Math.max(targetPoint.y, 0.5), -TANK_H / 2 + 1.5, TANK_H / 2 - 0.5);
        const fz = THREE.MathUtils.clamp((Math.random() - 0.5) * (TANK_D - 1.6), -TANK_D / 2 + 0.8, TANK_D / 2 - 0.8);
        spawnFoodPellet(fx, fy, fz);
    }
}

function spawnFoodPellet(x, y, z) {
    if (foodPellets.length >= 22) {
        const oldest = foodPellets.shift();
        foodGroup.remove(oldest.mesh);
    }
    const foodColors = [0xd97706, 0x10b981, 0xec4899, 0xfbbf24];
    const col = foodColors[Math.min(gameState.foodLevel - 1, foodColors.length - 1)];
    const geo = new THREE.SphereGeometry(0.085, 8, 8);
    const mat = new THREE.MeshStandardMaterial({ color: col, roughness: 0.4 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y, z);
    foodGroup.add(mesh);

    foodPellets.push({
        mesh,
        vy: -0.65 - Math.random() * 0.25,
        wobble: Math.random() * Math.PI * 2,
        nutrition: 25 + (gameState.foodLevel - 1) * 10,
        growthBonus: 1 + (gameState.foodLevel - 1) * 0.35
    });
    sound.playWaterDrop();
}

// 8. 經濟系統、收益、互動提示
function grantPassiveIncome() {
    let total = 0;
    gameState.fishes.forEach(fish => {
        const inc = getFishPassiveIncome(fish);
        if (inc > 0) {
            total += inc;
            const entry = fishMeshes.get(fish.id);
            if (entry && !isZenMode) {
                spawnFloatingCoinText(entry.root.position, `+${inc}`);
            }
        }
    });
    if (total > 0) {
        gameState.coins += total;
        updateHUD();
    }
}

function spawnFloatingCoinText(worldPos, text) {
    const projected = worldPos.clone().project(camera);
    const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-(projected.y * 0.5) + 0.5) * window.innerHeight;
    if (x < 0 || x > window.innerWidth || y < 0 || y > window.innerHeight) return;

    const el = document.createElement('div');
    el.className = 'coin-float fixed text-xs sm:text-sm font-bold text-amber-300 drop-shadow';
    el.style.left = `${x}px`;
    el.style.top = `${y - 16}px`;
    el.textContent = `🪙 ${text}`;
    document.getElementById('floating-texts').appendChild(el);
    setTimeout(() => el.remove(), 1300);
}

function showToast(msg) {
    const toast = document.getElementById('toast-msg');
    document.getElementById('toast-text').textContent = msg;
    toast.classList.remove('opacity-0');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.add('opacity-0'), 2200);
}

function updateHUD() {
    document.getElementById('hud-coins').textContent = gameState.coins.toLocaleString();
    document.getElementById('hud-capacity').textContent = `${gameState.fishes.length} / ${getMaxCapacity()}`;
    let totalIncome = 0;
    gameState.fishes.forEach(f => totalIncome += getFishPassiveIncome(f));
    document.getElementById('hud-income').textContent = `+${totalIncome} / 10秒`;
}

// 9. UI 面板互動
function setLighting(mode) {
    gameState.lighting = mode;
    ['day', 'sunset', 'night'].forEach(m => {
        const btn = document.getElementById(`btn-light-${m}`);
        if (m === mode) {
            btn.classList.add('bg-cyan-500/30', 'text-white');
            btn.classList.remove('text-slate-300');
        } else {
            btn.classList.remove('bg-cyan-500/30', 'text-white');
            btn.classList.add('text-slate-300');
        }
    });

    if (mode === 'day') {
        scene.background.set('#081726');
        scene.fog.color.set('#081726');
        ambientLight.color.set('#bae6fd');
        ambientLight.intensity = 0.85;
        dirLight.color.set('#ffffff');
        dirLight.intensity = 1.15;
        pointLight1.color.set('#38bdf8');
        pointLight2.color.set('#f472b6');
    } else if (mode === 'sunset') {
        scene.background.set('#1f1226');
        scene.fog.color.set('#1f1226');
        ambientLight.color.set('#fdba74');
        ambientLight.intensity = 0.78;
        dirLight.color.set('#fb923c');
        dirLight.intensity = 1.1;
        pointLight1.color.set('#f43f5e');
        pointLight2.color.set('#fbbf24');
    } else if (mode === 'night') {
        scene.background.set('#030812');
        scene.fog.color.set('#030812');
        ambientLight.color.set('#1e3a8a');
        ambientLight.intensity = 0.65;
        dirLight.color.set('#38bdf8');
        dirLight.intensity = 0.65;
        pointLight1.color.set('#22d3ee');
        pointLight2.color.set('#a855f7');
    }
    saveGame();
}

function toggleZenMode() {

const SPEED_OPTIONS = [0.5, 1, 3, 6];

function setTimeScaleByIndex(idx) {
    const val = SPEED_OPTIONS[parseInt(idx, 10)] ?? 1;

}

function setTimeScale(val) {
    timeScale = parseFloat(val);
    const slider = document.getElementById('time-speed-slider');

function closeOfflineReport() {
    const card = document.getElementById('offline-events-card');

function openFishInspector(fishId) {
    selectedFishId = fishId;
    closeOfflineReport();

    insp.classList.remove('hidden');
    updateInspectorLive();
}

function closeInspector() {
    selectedFishId = null;
    document.getElementById('fish-inspector').classList.add('hidden');
}

function updateInspectorLive() {
    const fish = gameState.fishes.find(f => f.id === selectedFishId);
    if (!fish) {
        closeInspector();
        return;
    }
    const species = FISH_SPECIES.find(s => s.id === fish.speciesId) || FISH_SPECIES[0];
    const stageInfo = getFishStageInfo(fish);
    const rarity = RARITY_STYLES[species.rarity];

    document.getElementById('insp-icon').textContent = species.icon;
    const nameInput = document.getElementById('insp-name-input');
    if (document.activeElement !== nameInput) {
        nameInput.value = fish.name;
    }
    document.getElementById('insp-shiny-badge').classList.toggle('hidden', !fish.isShiny);
    document.getElementById('insp-species').textContent = `${species.name} • ${rarity.label}`;
    document.getElementById('insp-stage').textContent = stageInfo.label;
    document.getElementById('insp-growth-pct').textContent = `${stageInfo.progress}%`;
    document.getElementById('insp-growth-bar').style.width = `${stageInfo.progress}%`;

    const hungerPct = Math.round(fish.hunger);
    document.getElementById('insp-hunger-pct').textContent = `${hungerPct}%`;
    document.getElementById('insp-hunger-bar').style.width = `${hungerPct}%`;

    const passive = getFishPassiveIncome(fish);
    document.getElementById('insp-passive').textContent = stageInfo.isAdult ? `+${passive} 🪙/10s` : `成魚後開啟`;

    const lockBtn = document.getElementById('insp-lock-btn');
    lockBtn.innerHTML = fish.locked ? `<span>🔒</span> <span class="text-amber-300">已上鎖</span>` : `<span>🔓</span> <span>未上鎖</span>`;

    const sellBtn = document.getElementById('insp-sell-btn');
    const sellPrice = getFishSellValue(fish);
    document.getElementById('insp-sell-price').textContent = fish.locked ? '已保護' : `出售 ${sellPrice}`;
    sellBtn.disabled = fish.locked;
    sellBtn.classList.toggle('opacity-40', fish.locked);
}

function renameSelectedFish(newName) {
    const fish = gameState.fishes.find(f => f.id === selectedFishId);
    if (fish && newName.trim()) {
        fish.name = newName.trim();
        saveGame();
        showToast(`已將魚兒命名為「${fish.name}」`);
    }
}

function toggleLockSelectedFish() {
    const fish = gameState.fishes.find(f => f.id === selectedFishId);
    if (fish) {
        fish.locked = !fish.locked;
        updateInspectorLive();
        saveGame();
    }
}

function sellSelectedFish() {
    const idx = gameState.fishes.findIndex(f => f.id === selectedFishId);
    if (idx === -1) return;
    const fish = gameState.fishes[idx];
    if (fish.locked) {
        showToast('這隻魚已上鎖，請先解鎖再出售');
        return;
    }
    const price = getFishSellValue(fish);
    gameState.coins += price;
    gameState.fishes.splice(idx, 1);
    removeFish3DMesh(fish.id);
    closeInspector();
    updateHUD();
    sound.playCoinChime();
    showToast(`出售「${fish.name}」獲得 ${price} 金幣！`);
    saveGame();
}

    if (gameState.fishes.length >= getMaxCapacity()) {
        showToast('魚缸已滿！請先出售成魚或升級魚缸容量');
        return;
    }
    if (gameState.coins < pack.price) {
        showToast('療癒金幣不足！點選畫面餵魚或等待成魚產出金幣');
        return;
    }

    gameState.coins -= pack.price;

    const totalWeight = pack.pool.reduce((acc, item) => acc + item.weight, 0);
    let r = Math.random() * totalWeight;
    let chosenId = pack.pool[0].id;
    for (const item of pack.pool) {
        if (r < item.weight) {
            chosenId = item.id;
            break;
        }
        r -= item.weight;
    }

    const shinyChance = gameState.decorations.includes('crystal') ? 0.22 : 0.12;
    const isShiny = Math.random() < shinyChance;

    const newFish = addFishToTank(chosenId, isShiny);
    const sp = FISH_SPECIES.find(s => s.id === chosenId);

    sound.playCoinChime();
    updateHUD();
    saveGame();
    closeModal();
    showToast(isShiny ? `✨ 奇蹟誕生！獲得異色「${sp.name}」！` : `🌱 歡迎新成員「${sp.name}」加入水族箱！`);
    openFishInspector(newFish.id);
}

function addFishToTank(speciesId, isShiny = false, customName = null) {
    const sp = FISH_SPECIES.find(s => s.id === speciesId) || FISH_SPECIES[0];
    const fishObj = {
        id: 'fish_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        speciesId: sp.id,
        name: customName || sp.name,
        growth: 0,
        hunger: 85,
        isShiny: isShiny,
        locked: false
    };
    gameState.fishes.push(fishObj);
    if (!gameState.discovered.includes(sp.id)) gameState.discovered.push(sp.id);
    if (isShiny && !gameState.shinyDiscovered.includes(sp.id)) gameState.shinyDiscovered.push(sp.id);
    createFish3DMesh(fishObj);
    return fishObj;
}

function upgradeTank() {
    const cost = gameState.tankLevel * 180;
    if (gameState.coins < cost) {
        showToast('金幣不足，無法擴建水族箱');
        return;
    }
    gameState.coins -= cost;
    gameState.tankLevel++;
    sound.playCoinChime();
    updateHUD();
    renderModalContent();
    saveGame();
    showToast(`水族箱擴建至 Lv.${gameState.tankLevel}！`);
}

function upgradeFood() {
    if (gameState.foodLevel >= 4) return;
    const cost = gameState.foodLevel * 140;
    if (gameState.coins < cost) {
        showToast('金幣不足，無法升級飼料');
        return;
    }
    gameState.coins -= cost;
    gameState.foodLevel++;
    sound.playCoinChime();
    updateHUD();
    renderModalContent();
    saveGame();
    showToast(`飼料配方升級至 Lv.${gameState.foodLevel}！`);
}

function buyDecoration(decorId) {
    const dec = DECORATIONS.find(d => d.id === decorId);
    if (!dec || gameState.decorations.includes(decorId)) return;
    if (gameState.coins < dec.price) {
        showToast('金幣不足，無法購買此造景');
        return;
    }
    gameState.coins -= dec.price;
    gameState.decorations.push(decorId);
    rebuildDecorations3D();
    sound.playCoinChime();
    updateHUD();
    renderModalContent();
    saveGame();
    showToast(`已擺設「${dec.name}」！`);
}

// 10. 本地存檔載入與離線生態模擬系統
function formatOfflineDuration(seconds) {
    if (seconds < 60) return `${Math.floor(seconds)} 秒`;
    const mins = Math.floor(seconds / 60);
    if (mins < 60) return `${mins} 分鐘`;
    const hrs = Math.floor(mins / 60);
    const remMins = mins % 60;
    if (hrs < 24) return `${hrs} 小時 ${remMins} 分鐘`;
    const days = Math.floor(hrs / 24);
    const remHrs = hrs % 24;
    return `${days} 天 ${remHrs} 小時`;
}

function simulateOfflineProgress(offlineSec) {
    const effectiveSec = Math.min(offlineSec, 604800);
    if (effectiveSec < 15 || gameState.fishes.length === 0) return;

    const events = [];
    const decorGrowthMult = gameState.decorations.includes('coral_reef') ? 1.15 : 1.0;
    let totalOfflineCoins = 0;
    const offlineGrowthMult = 0.55 * decorGrowthMult;

    gameState.fishes.forEach(fish => {
        const species = FISH_SPECIES.find(s => s.id === fish.speciesId) || FISH_SPECIES[0];
        const beforeStage = getFishStageInfo(fish);
        const wasAdult = beforeStage.isAdult;

        fish.growth += effectiveSec * offlineGrowthMult;
        fish.hunger = Math.max(25, fish.hunger - effectiveSec * 0.05);

        const afterStage = getFishStageInfo(fish);

        if (beforeStage.stage === 'fry' && afterStage.stage === 'juvenile') {
            events.push(`🌱 「${fish.name}」(${species.name}) 茁壯成長為幼魚了！`);
        } else if (!wasAdult && afterStage.isAdult) {
            events.push(`🎉 「${fish.name}」(${species.name}) 已完全長成成魚，開始產出療癒金幣！`);
        }

        const cycles = Math.floor(effectiveSec / 10);
        if (cycles > 0) {
            if (wasAdult) {
                totalOfflineCoins += getFishPassiveIncome(fish) * cycles * 0.6;
            } else if (afterStage.isAdult) {
                totalOfflineCoins += getFishPassiveIncome(fish) * Math.floor(cycles * 0.4) * 0.6;
            }
        }
    });

    const earnedCoins = Math.floor(totalOfflineCoins);
    if (earnedCoins > 0) {
        gameState.coins += earnedCoins;
        events.unshift(`🪙 魚群在您離開期間共為您累積了 ${earnedCoins} 金幣！`);
    }

    if (events.length === 0) {
        events.push(`💧 魚群在水族箱裡悠閒游動，一切安好，成長進度持續推進中。`);
    }

    const card = document.getElementById('offline-events-card');
    const durBadge = document.getElementById('offline-duration-badge');
    const listEl = document.getElementById('offline-events-list');
    if (card && durBadge && listEl) {
        durBadge.textContent = `離線經過：${formatOfflineDuration(effectiveSec)}`;
        listEl.innerHTML = events.map(ev => `<li class="bg-black/25 px-2.5 py-2 rounded-xl border border-white/5 leading-relaxed">${ev}</li>`).join('');
        card.classList.remove('hidden');
    }
}

function saveGame() {
    try {
        gameState.lastSaveTime = Date.now();
        localStorage.setItem('urban_chillquarium_3d_v1', JSON.stringify(gameState));
    } catch (e) {}
}

function loadGame() {
    let hasExistingSave = false;
    try {
        const raw = localStorage.getItem('urban_chillquarium_3d_v1');
        if (raw) {
            const parsed = JSON.parse(raw);
            gameState = { ...DEFAULT_STATE, ...parsed };
            gameState.fishes = (gameState.fishes || []).filter(f => FISH_SPECIES.some(s => s.id === f.speciesId));
            hasExistingSave = gameState.fishes.length > 0;
        }
    } catch (e) {
        gameState = JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    if (!hasExistingSave) {
        addFishToTank('guppy', false, '小綠');
        addFishToTank('neon_tetra', false, '霓虹');
    } else {
        const now = Date.now();
        const offlineSec = Math.max(0, (now - (gameState.lastSaveTime || now)) / 1000);
        simulateOfflineProgress(offlineSec);
        gameState.fishes.forEach(f => createFish3DMesh(f));
    }

    rebuildDecorations3D();
    setLighting(gameState.lighting || 'day');
    document.getElementById('mute-btn').textContent = gameState.muted ? '🔇' : '🔊';
    updateHUD();
    saveGame();
}

window.addEventListener('beforeunload', () => {
    saveGame();
});

window.onload = function () {
    initThreeJS();
    loadGame();
    animate();
};
</script>
